<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
<defs>
<filter id="clay" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="7" diffuseConstant="1.25" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
 <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1" result="lit"/>
 <feSpecularLighting in="b" surfaceScale="7" specularConstant=".3" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
 <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
 <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dx="7" dy="11"/><feColorMatrix values="0 0 0 0 .15 0 0 0 0 .1 0 0 0 0 .2 0 0 0 .32 0" result="sh"/>
 <feMerge><feMergeNode in="sh"/><feMergeNode in="lit"/><feMergeNode in="s2"/></feMerge>
</filter>
<filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .25 0 0 0 -1.3 .8"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc4ea"/><stop offset="1" stop-color="#c5e8f5"/></linearGradient>
<pattern id="corr" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c79d6e"/><rect width="5" height="10" fill="#b98c5c"/></pattern>
</defs>
